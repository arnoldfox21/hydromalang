<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="waterAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Glow Aura -->
  <circle cx="300" cy="300" r="260" fill="url(#waterAura)" />

  <!-- Base Water Ripples -->
  <ellipse cx="300" cy="450" rx="240" ry="36" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.5" />
  <ellipse cx="300" cy="450" rx="180" ry="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" />
  <ellipse cx="300" cy="450" rx="110" ry="16" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.9" />

  <!-- Crown Water Splash -->
  <g filter="url(#splashGlow)">
    <path d="M 180 440 
             C 170 380, 140 330, 120 280
             C 125 285, 145 320, 165 350
             C 175 320, 195 240, 210 200
             C 215 215, 220 280, 230 330
             C 245 290, 270 210, 290 150
             C 295 180, 298 260, 305 320
             C 320 260, 350 200, 370 170
             C 375 190, 370 270, 380 320
             C 395 270, 430 250, 460 220
             C 455 240, 435 320, 420 360
             C 440 330, 465 300, 490 290
             C 480 340, 440 400, 420 440
             Z" 
          fill="url(#splashGrad)" opacity="0.88" />

    <!-- Inner Splash Layer (Reflections) -->
    <path d="M 210 440 
             C 200 390, 185 340, 180 300
             C 195 330, 225 350, 245 340
             C 260 300, 280 230, 295 190
             C 305 230, 320 310, 335 340
             C 355 310, 390 280, 410 270
             C 400 320, 370 410, 360 440
             Z" 
          fill="#e0f2fe" opacity="0.6" />
  </g>

  <!-- Big Central Water Drop Rebound -->
  <path d="M 300 70 C 275 110, 260 140, 260 165 C 260 188, 278 205, 300 205 C 322 205, 340 188, 340 165 C 340 140, 325 110, 300 70 Z" fill="url(#dropGrad)" filter="url(#splashGlow)" />
  <circle cx="288" cy="145" r="9" fill="#ffffff" opacity="0.8" />

  <!-- Surrounding Suspended Water Droplets -->
  <g fill="url(#dropGrad)">
    <circle cx="115" cy="245" r="14" />
    <circle cx="110" cy="240" r="4" fill="#ffffff" opacity="0.9" />

    <circle cx="205" cy="170" r="11" />
    <circle cx="202" cy="167" r="3.5" fill="#ffffff" opacity="0.9" />

    <circle cx="380" cy="140" r="12" />
    <circle cx="376" cy="136" r="4" fill="#ffffff" opacity="0.9" />

    <circle cx="475" cy="190" r="15" />
    <circle cx="470" cy="185" r="5" fill="#ffffff" opacity="0.9" />

    <circle cx="505" cy="265" r="10" />
    <circle cx="140" cy="190" r="8" />
    <circle cx="250" cy="120" r="9" />
    <circle cx="340" cy="110" r="7" />
    <circle cx="440" cy="140" r="8" />
    <circle cx="160" cy="290" r="6" />
    <circle cx="450" cy="310" r="7" />
  </g>
</svg>
