<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="900" height="380" rx="20" fill="url(#bgCard)" stroke="#bae6fd" stroke-width="2" />

  <!-- Connecting Pipe Flow -->
  <path d="M 120 180 L 780 180" stroke="#bae6fd" stroke-width="8" stroke-linecap="round" />
  <path d="M 120 180 L 780 180" stroke="#0284c7" stroke-width="3" stroke-dasharray="8,8" />

  <!-- Step 1: Sumber Air Alami -->
  <g transform="translate(60, 90)" filter="url(#fShadow)">
    <rect width="130" height="180" rx="16" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="65" cy="50" r="30" fill="url(#stepGrad)" />
    <!-- Mountain Icon -->
    <path d="M 50 62 L 65 38 L 80 62 Z" fill="#ffffff" />
    <path d="M 68 62 L 78 48 L 88 62 Z" fill="#bae6fd" />
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Tahap 01</text>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Mata Air Alami</text>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Pegunungan Malang</text>
    <text x="65" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7" font-weight="600" text-anchor="middle">Kaya Mineral Alami</text>
  </g>

  <!-- Step 2: Filtrasi Pasir Silika & Karbon Aktif -->
  <g transform="translate(225, 90)" filter="url(#fShadow)">
    <rect width="130" height="180" rx="16" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="65" cy="50" r="30" fill="url(#stepGrad)" />
    <!-- Filter Layers Icon -->
    <rect x="47" y="38" width="36" height="6" rx="2" fill="#ffffff" />
    <rect x="47" y="47" width="36" height="6" rx="2" fill="#bae6fd" />
    <rect x="47" y="56" width="36" height="6" rx="2" fill="#e0f2fe" />
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Tahap 02</text>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Multi-Filtrasi</text>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Pasir Silika &amp; Karbon</text>
    <text x="65" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7" font-weight="600" text-anchor="middle">Menyaring Sedimen</text>
  </g>

  <!-- Step 3: Mikrofiltrasi Presisi 0.01u -->
  <g transform="translate(390, 90)" filter="url(#fShadow)">
    <rect width="130" height="180" rx="16" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="65" cy="50" r="30" fill="url(#stepGrad)" />
    <!-- Micro filter grid icon -->
    <circle cx="65" cy="50" r="16" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 57 50 L 73 50 M 65 42 L 65 58" stroke="#ffffff" stroke-width="2" />
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Tahap 03</text>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Mikrofiltrasi</text>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Kerapatan 0.01 Mikron</text>
    <text x="65" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7" font-weight="600" text-anchor="middle">Bebas Partikel Renik</text>
  </g>

  <!-- Step 4: Sinar UV & Ozonisasi -->
  <g transform="translate(555, 90)" filter="url(#fShadow)">
    <rect width="130" height="180" rx="16" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="65" cy="50" r="30" fill="url(#stepGrad)" />
    <!-- UV Zap / Shield Icon -->
    <path d="M 65 35 L 75 48 L 66 48 L 68 65 L 55 52 L 64 52 Z" fill="#ffffff" />
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Tahap 04</text>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">UV &amp; Ozonisasi</text>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Sterilisasi Ganda O3</text>
    <text x="65" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="600" text-anchor="middle">99.9% Bebas Bakteri</text>
  </g>

  <!-- Step 5: Higienis & Uji Laboratorium SNI -->
  <g transform="translate(720, 90)" filter="url(#fShadow)">
    <rect width="130" height="180" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <circle cx="65" cy="50" r="30" fill="#10b981" />
    <!-- Quality Checkmark & Badge -->
    <circle cx="65" cy="50" r="16" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 58 50 L 63 55 L 72 45" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">Tahap 05</text>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Kemasan &amp; SNI</text>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Quality Control Ketat</text>
    <text x="65" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">Siap Dikonsumsi</text>
  </g>

  <!-- Title on top of component -->
  <text x="450" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">STANDAR HIGIENIS &amp; PEMURNIAN MODERN HYDRO MALANG</text>
  <text x="450" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Mempertahankan mineral esensial alami pegunungan dengan keamanan mikrobiologi tertinggi</text>
</svg>
