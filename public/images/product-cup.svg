<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="cupShadow" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="180" cy="385" rx="90" ry="14" fill="#0284c7" opacity="0.25" />

  <g filter="url(#cupShadow)">
    <!-- Cup Body (Trapezoid) -->
    <polygon points="80,105 110,360 250,360 280,105" fill="url(#cupGrad)" stroke="#7dd3fc" stroke-width="1.5" />

    <!-- Cup Liquid Fill -->
    <polygon points="85,130 112,355 248,355 275,130" fill="#0ea5e9" opacity="0.35" />

    <!-- Grip Ribs around Cup -->
    <path d="M 88 170 Q 180 185 272 170" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 93 210 Q 180 225 267 210" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 98 250 Q 180 265 262 250" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 103 290 Q 180 305 257 290" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Cup Rim Collar -->
    <ellipse cx="180" cy="105" rx="102" ry="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Sealed Foil Lid -->
    <ellipse cx="180" cy="102" rx="100" ry="17" fill="url(#foilGrad)" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Foil Rim Pattern -->
    <ellipse cx="180" cy="102" rx="94" ry="15" fill="none" stroke="#bae6fd" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Brand Print on Foil Lid -->
    <text x="180" y="103" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HYDRO MALANG</text>
    <text x="180" y="112" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#bae6fd" text-anchor="middle">220 ml • SNI &amp; BPOM</text>

    <!-- Side Brand Print on Cup -->
    <rect x="135" y="215" width="90" height="48" rx="6" fill="#ffffff" opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="180" y="233" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#0369a1" text-anchor="middle">HYDRO</text>
    <text x="180" y="244" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#0ea5e9" text-anchor="middle">MALANG</text>
    <text x="180" y="255" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" fill="#64748b" text-anchor="middle">Air Mineral Sehat</text>

    <!-- Straw piercing target spot -->
    <circle cx="180" cy="94" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1" />
    <circle cx="180" cy="94" r="2" fill="#ffffff" />

    <!-- Light Highlights on Cup Plastic -->
    <path d="M 105 130 L 125 350" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5" />
    <path d="M 115 130 L 133 345" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Water condensation droplets -->
    <circle cx="98" cy="150" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="260" cy="165" r="3.5" fill="#ffffff" opacity="0.8" />
    <circle cx="245" cy="310" r="3" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
