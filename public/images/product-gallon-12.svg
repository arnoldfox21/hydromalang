<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" width="100%" height="100%">
  <defs>
    <linearGradient id="g12Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="water12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cap12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <ellipse cx="230" cy="530" rx="145" ry="20" fill="#0284c7" opacity="0.18" />
  <ellipse cx="230" cy="530" rx="100" ry="12" fill="#0369a1" opacity="0.25" />

  <g filter="url(#shadow12)">
    <!-- Neck -->
    <rect x="202" y="65" width="56" height="42" rx="4" fill="url(#g12Grad)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="230" cy="107" rx="32" ry="7" fill="#0284c7" />

    <!-- Shoulder -->
    <path d="M 198 107 C 168 140, 132 165, 122 205 L 338 205 C 328 165, 292 140, 262 107 Z" fill="url(#g12Grad)" stroke="#7dd3fc" stroke-width="1" />

    <!-- Main Cylinder Body (compact 12.8L) -->
    <rect x="118" y="205" width="224" height="275" rx="18" fill="url(#g12Grad)" />
    
    <!-- Water Inside -->
    <path d="M 120 220 Q 230 232 340 220 L 340 470 Q 230 488 120 470 Z" fill="url(#water12)" opacity="0.85" />

    <!-- Ribs -->
    <rect x="118" y="240" width="224" height="10" rx="5" fill="#0284c7" opacity="0.45" />
    <line x1="122" y1="242" x2="338" y2="242" stroke="#bae6fd" stroke-width="1.5" opacity="0.6" />

    <rect x="118" y="295" width="224" height="10" rx="5" fill="#0284c7" opacity="0.45" />
    <line x1="122" y1="297" x2="338" y2="297" stroke="#bae6fd" stroke-width="1.5" opacity="0.6" />

    <rect x="118" y="420" width="224" height="10" rx="5" fill="#0284c7" opacity="0.45" />
    <line x1="122" y1="422" x2="338" y2="422" stroke="#bae6fd" stroke-width="1.5" opacity="0.6" />

    <!-- Base -->
    <path d="M 122 480 C 132 505, 328 505, 338 480 Z" fill="#0369a1" />

    <!-- Handle -->
    <path d="M 118 265 C 78 270, 78 340, 118 345 L 118 327 C 98 322, 98 288, 118 283 Z" fill="url(#g12Grad)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Highlights -->
    <path d="M 148 130 L 148 470" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.35" />
    <path d="M 166 145 L 166 455" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 315 135 L 315 465" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.2" />

    <!-- Brand Label -->
    <rect x="144" y="320" width="172" height="85" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="230" y="348" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">HYDRO MALANG</text>
    <text x="230" y="365" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">AIR 12.8L SLIM</text>
    <text x="230" y="379" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">Ringan &amp; Praktis untuk Kamar / Kos</text>

    <rect x="180" y="386" width="100" height="14" rx="7" fill="#0284c7" />
    <text x="230" y="396" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">NETTO 12.8 LITER</text>

    <!-- Sealed Cap -->
    <path d="M 197 46 L 263 46 L 260 67 L 200 67 Z" fill="url(#cap12)" stroke="#1e3a8a" stroke-width="1.5" />
    <ellipse cx="230" cy="46" rx="33" ry="7" fill="#60a5fa" />
    <rect x="216" y="34" width="28" height="12" rx="3" fill="#ef4444" />
    <text x="230" y="42" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">SEALED</text>
  </g>
</svg>
