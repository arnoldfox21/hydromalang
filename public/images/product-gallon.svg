<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Gallon Plastic Gradient -->
    <linearGradient id="gallonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="waterLevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>

    <filter id="dropletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#0c4a6e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Glow & Reflection Ground -->
  <ellipse cx="250" cy="580" rx="170" ry="24" fill="#0284c7" opacity="0.18" />
  <ellipse cx="250" cy="580" rx="120" ry="14" fill="#0369a1" opacity="0.25" />

  <!-- Main Gallon Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Gallon Neck & Collar -->
    <rect x="220" y="70" width="60" height="45" rx="5" fill="url(#gallonGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="250" cy="115" rx="36" ry="8" fill="#0284c7" />

    <!-- Gallon Shoulder -->
    <path d="M 214 115 C 180 150, 140 180, 130 220 L 370 220 C 360 180, 320 150, 286 115 Z" fill="url(#gallonGrad)" stroke="#7dd3fc" stroke-width="1" />

    <!-- Gallon Main Cylinder Ribbed Body -->
    <rect x="125" y="220" width="250" height="320" rx="20" fill="url(#gallonGrad)" />
    
    <!-- Water Volume Inside -->
    <path d="M 127 240 Q 250 255 373 240 L 373 525 Q 250 545 127 525 Z" fill="url(#waterLevel)" opacity="0.85" />

    <!-- Horizontal Gallon Reinforcement Ribs -->
    <!-- Rib 1 -->
    <rect x="125" y="260" width="250" height="12" rx="6" fill="#0284c7" opacity="0.45" />
    <line x1="130" y1="262" x2="370" y2="262" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

    <!-- Rib 2 -->
    <rect x="125" y="320" width="250" height="12" rx="6" fill="#0284c7" opacity="0.45" />
    <line x1="130" y1="322" x2="370" y2="322" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

    <!-- Rib 3 -->
    <rect x="125" y="440" width="250" height="12" rx="6" fill="#0284c7" opacity="0.45" />
    <line x1="130" y1="442" x2="370" y2="442" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

    <!-- Rib 4 -->
    <rect x="125" y="500" width="250" height="12" rx="6" fill="#0284c7" opacity="0.45" />
    <line x1="130" y1="502" x2="370" y2="502" stroke="#bae6fd" stroke-width="2" opacity="0.6" />

    <!-- Gallon Bottom Base -->
    <path d="M 130 540 C 140 565, 360 565, 370 540 Z" fill="#0369a1" />

    <!-- Gallon Ergonomic Handle -->
    <path d="M 125 285 C 80 290, 80 370, 125 375 L 125 355 C 105 350, 105 310, 125 305 Z" fill="url(#gallonGrad)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Vertical Light Reflection Streaks -->
    <path d="M 160 140 L 160 530" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.35" />
    <path d="M 180 160 L 180 510" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <path d="M 345 150 L 345 520" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.2" />

    <!-- BRAND LABEL -->
    <rect x="155" y="345" width="190" height="85" rx="10" fill="url(#labelGrad)" stroke="#0284c7" stroke-width="2" />
    <path d="M 155 345 L 345 345 L 345 365 Q 250 380 155 365 Z" fill="#0284c7" opacity="0.15" />
    
    <!-- Brand Logo Text / Elements on Gallon -->
    <text x="250" y="378" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">HYDRO MALANG</text>
    <text x="250" y="396" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0284c7" text-anchor="middle" letter-spacing="0.5">AIR MINERAL ALAMI PEGUNUNGAN</text>
    
    <!-- Badges on Label -->
    <rect x="175" y="405" width="65" height="15" rx="7" fill="#0284c7" />
    <text x="207" y="416" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">NETTO 19L</text>
    
    <rect x="260" y="405" width="65" height="15" rx="7" fill="#10b981" />
    <text x="292" y="416" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">BPA FREE</text>

    <!-- Gallon Sealed Cap -->
    <path d="M 215 50 L 285 50 L 282 72 L 218 72 Z" fill="url(#capGrad)" stroke="#1e3a8a" stroke-width="1.5" />
    <ellipse cx="250" cy="50" rx="35" ry="8" fill="#60a5fa" />
    <rect x="235" y="36" width="30" height="14" rx="3" fill="#ef4444" />
    <text x="250" y="46" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">SEALED</text>

    <!-- Water Condensation Droplets -->
    <g filter="url(#dropletShadow)">
      <circle cx="150" cy="235" r="4" fill="#ffffff" opacity="0.8" />
      <circle cx="148" cy="246" r="3" fill="#ffffff" opacity="0.7" />
      <circle cx="340" cy="275" r="5" fill="#ffffff" opacity="0.85" />
      <circle cx="343" cy="290" r="3.5" fill="#ffffff" opacity="0.75" />
      <circle cx="330" cy="480" r="4.5" fill="#ffffff" opacity="0.8" />
      <circle cx="170" cy="460" r="3.5" fill="#ffffff" opacity="0.85" />
      <circle cx="165" cy="472" r="5" fill="#ffffff" opacity="0.9" />
      <circle cx="210" cy="515" r="4" fill="#ffffff" opacity="0.85" />
    </g>
  </g>
</svg>
