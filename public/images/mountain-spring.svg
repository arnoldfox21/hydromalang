<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="mountFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Morning Sun & Rays -->
  <circle cx="580" cy="120" r="110" fill="url(#sunGlow)" filter="url(#softGlow)" />
  <circle cx="580" cy="120" r="42" fill="#fffbeb" opacity="0.9" />

  <!-- Distant Mountains (Semeru / Arjuno Peak) -->
  <path d="M 120 320 L 320 130 L 520 320 Z" fill="url(#mountBack)" />
  <path d="M 380 320 L 580 150 L 780 320 Z" fill="url(#mountBack)" opacity="0.7" />

  <!-- Snow/Mist on Peaks -->
  <polygon points="320,130 300,165 315,160 320,168 335,158 340,165" fill="#ffffff" opacity="0.85" />
  <polygon points="580,150 565,180 575,176 580,184 595,174" fill="#ffffff" opacity="0.75" />

  <!-- Midground Mountain Forest -->
  <path d="M -50 360 Q 180 210 390 280 T 850 330 L 850 500 L -50 500 Z" fill="url(#mountMid)" />

  <!-- Pine Tree Silhouettes on Ridge -->
  <g fill="#0e7490" opacity="0.6">
    <polygon points="120,290 112,320 128,320" />
    <polygon points="135,285 127,318 143,318" />
    <polygon points="150,295 144,322 156,322" />
    <polygon points="210,275 202,308 218,308" />
    <polygon points="225,270 216,306 234,306" />
    <polygon points="242,280 235,310 249,310" />
    <polygon points="460,290 452,325 468,325" />
    <polygon points="480,285 471,323 489,323" />
  </g>

  <!-- Foreground Green Foothills -->
  <path d="M -20 380 Q 220 310 440 370 T 820 360 L 820 500 L -20 500 Z" fill="url(#mountFront)" />

  <!-- River Stream / Spring cascading from highlands -->
  <path d="M 370 330 C 350 380, 430 400, 390 440 C 370 460, 330 470, 300 500 L 580 500 C 530 470, 480 440, 460 410 C 430 370, 410 340, 385 330 Z" fill="url(#streamGrad)" />

  <!-- River foam & ripples -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 385 350 Q 395 355 405 352" />
    <path d="M 370 380 Q 395 385 420 378" />
    <path d="M 390 415 Q 425 420 445 410" />
    <path d="M 350 450 Q 400 455 450 445" />
    <path d="M 320 480 Q 410 490 500 475" stroke-width="3.5" />
  </g>

  <!-- Natural River Rocks -->
  <ellipse cx="320" cy="460" rx="45" ry="25" fill="url(#rockGrad)" />
  <ellipse cx="330" cy="455" rx="35" ry="18" fill="#475569" opacity="0.4" />
  <ellipse cx="490" cy="445" rx="55" ry="30" fill="url(#rockGrad)" />
  <ellipse cx="500" cy="440" rx="45" ry="22" fill="#475569" opacity="0.4" />
  <ellipse cx="410" cy="485" rx="60" ry="22" fill="url(#rockGrad)" />

  <!-- Pure Water Droplets / Sparkles -->
  <g fill="#e0f2fe">
    <circle cx="395" cy="410" r="4" opacity="0.9" />
    <circle cx="430" cy="425" r="3" opacity="0.8" />
    <circle cx="360" cy="445" r="3.5" opacity="0.85" />
    <circle cx="475" cy="450" r="4" opacity="0.9" />
    <circle cx="340" cy="470" r="5" opacity="0.9" />
  </g>

  <!-- Morning Mist / Clean Air Banner -->
  <rect x="0" y="470" width="800" height="30" fill="#0369a1" opacity="0.25" />
</svg>
